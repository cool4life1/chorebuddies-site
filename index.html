<head>

  <title>ChoreBuddies: policies</title>
  <style>
:root { --bg: #ffffff; --fg: #1f2933; --muted: #52606d; --line: #e4e7eb; --accent: #2563eb; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111827; --fg: #e5e7eb; --muted: #9ca3af; --line: #374151; --accent: #60a5fa; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header, main, footer { max-width: 760px; margin: 0 auto; padding: 0 16px; }
header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center;
  padding-top: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
header a.brand { font-weight: 700; color: var(--fg); text-decoration: none; margin-right: auto; }
nav { display: flex; flex-wrap: wrap; gap: 4px 16px; }
a { color: var(--accent); }
main { padding-top: 8px; padding-bottom: 32px; }
h1 { font-size: 1.8rem; line-height: 1.25; }
h2 { margin-top: 2rem; }
table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
footer { border-top: 1px solid var(--line); padding-top: 16px; padding-bottom: 32px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
